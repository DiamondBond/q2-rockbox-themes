# Description: Crow theme!! All pixel art is by me. The picture on the menu changes according to the time of day (changes at 8 AM, 2 PM, and 6 PM). 
# Code based on: bunnyPod by me! which are based on SNARTY by Simon Anden and BONES by Chuck Largo! Credits to J. Adler for ProFont-CJK. Other fonts used are Bitstream Cyberbit and LanaPixel by eishiya. Also inspired by RatPod by Jannis Bolzern! 
# Caw caw!

#--CFG File--

wps: /.rockbox/wps/crowPod.wps
sbs: /.rockbox/wps/crowPod.sbs
selector type: bar (inverse)
font: /.rockbox/fonts/14-LanaPixel.fnt
background color: 635DAD
foreground color: 000429
statusbar: off
scrollbar: off
show icons: off
filetype colours: -
#
# The theme settings left out above, so the theme loaded before this one cannot show through
backdrop: -
line selector start color: ffeb9c
line selector end color: b58e00
line selector text color: 000000
ui viewport: -
iconset: /.rockbox/icons/tango_icons.16x16.bmp
viewers iconset: /.rockbox/icons/tango_icons_viewers.16x16.bmp
scrollbar width: 6
battery display: graphic
volume display: graphic
