ui viewport: -
wps: /.rockbox/wps/DriveBox.wps
sbs: -
font: /.rockbox/fonts/21-Adobe-Helvetica-Bold.fnt
foreground color: FFFFFF
background color: 000000
statusbar: top
backdrop: /.rockbox/backdrops/DriveBox.bmp
selector type: bar (gradient)
line selector start color: 2f6999
line selector end color: 002849
# line selector start color: ac2221
# line selector end color: 4b0101
line selector text color: FFFFFF
iconset: /.rockbox/icons/tango.20x16x16.bmp
viewers iconset: /.rockbox/icons/tango_viewers.20x16x16.bmp
filetype colours: -
