# Name: DetailText
# By: Rem Leafmoon
# Platform: iPod Video (320x240x16) - Standard build
wps: /.rockbox/wps/DetailText.wps
sbs: -
statusbar: top
iconset: -
viewers iconset: -
#
# The theme settings left out above, so the theme loaded before this one cannot show through
backdrop: -
font: /.rockbox/fonts/18-Adobe-Helvetica.fnt
foreground color: cecfce
background color: 000000
selector type: bar (gradient)
line selector start color: ffeb9c
line selector end color: b58e00
line selector text color: 000000
ui viewport: -
scrollbar: left
scrollbar width: 6
show icons: on
filetype colours: -
battery display: graphic
volume display: graphic
