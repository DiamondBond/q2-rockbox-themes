#
# SNAZZ3
# by Vera B
# based on SPAZZ by CHUCK LARDO, SNAZZY by Phil Graves, SNAZZ2 by Jihoon Kim
# license CC-BY-SA 4.0
# target resolution 320x240
# tested on iPod Video
#
# theme file: editable colours, ships with b&w colors
# suggested color themes:
# rasperry: bg: 382828 fg: d09898 (shown in theme preview)
# northern: bg: 232234 fg: a2accd
# terminal: bg: 001800 fg: 84e569
# biscuits: bg: 251c14 fg: c2a888
#
wps: /.rockbox/wps/SNAZZ3.wps
sbs: /.rockbox/wps/SNAZZ3.sbs
fms: -
#
font:  /.rockbox/fonts/22-KodeMono-SemiBold.fnt
background color: 000000
foreground color: ffffff
backdrop: -
filetype colours: -
show icons: off
selector type: bar (inverse)
scrollbar: off
#
#
#
# The theme settings left out above, so the theme loaded before this one cannot show through
line selector start color: ffeb9c
line selector end color: b58e00
line selector text color: 000000
ui viewport: -
iconset: /.rockbox/icons/tango_icons.16x16.bmp
viewers iconset: /.rockbox/icons/tango_icons_viewers.16x16.bmp
statusbar: top
scrollbar width: 6
battery display: graphic
volume display: graphic
