# LookAtMe by Serge Fnstll
# 2026-06-23 v1.0

wps: /.rockbox/wps/LookAtMe.wps
sbs: /.rockbox/wps/LookAtMe.sbs
foreground color: e3e3e3
background color: 000000
font: /.rockbox/fonts/16-Inter-Bold.fnt
statusbar: off
scrollbar: off
battery display: graphical
show icons: off
#
# The theme settings left out above, so the theme loaded before this one cannot show through
backdrop: -
selector type: bar (gradient)
line selector start color: ffeb9c
line selector end color: b58e00
line selector text color: 000000
ui viewport: -
iconset: /.rockbox/icons/tango_icons.16x16.bmp
viewers iconset: /.rockbox/icons/tango_icons_viewers.16x16.bmp
scrollbar width: 6
filetype colours: -
volume display: graphic
