# .cfg file created by rockbox 4.0 - http://www.rockbox.org
# Ported from the Eros Q / H2 config (2026-10-06): Eros Q-only settings
# dropped (filter roll-off, headphone lineout select), single-volume card
# paths, brightness remapped to the Q2's 1..20, LookAtMe from this repo.

volume: -10
statusbar: off
scrollbar: off
scrollbar width: 8
time format: 12hour
show icons: off
idle poweroff: 5
No Screen Lock For Selected Actions: on
Selective Screen Lock Actions: 321
brightness: 5
pause on headphone unplug: pause
foreground color: e7e3e7
line selector start color: 52b2ef
line selector end color: 31a2ef
line selector text color: 292829
start directory: /Music/
show files: music
database scan paths: /Music
database path: /Music/
replaygain type: off
crossfeed direct gain: -35
eq enabled: on
eq precut: 21
eq low shelf filter: 20, 7, 0
eq peak filter 1: 23, 7, 15
eq peak filter 2: 170, 8, -23
eq peak filter 3: 640, 8, 24
eq peak filter 4: 2000, 23, -12
eq peak filter 5: 0, 7, 0
eq peak filter 6: 0, 7, 0
eq peak filter 7: 0, 7, 0
eq peak filter 8: 0, 7, 0
eq high shelf filter: 20000, 7, 0
font: /.rockbox/fonts/16-Inter-Bold.fnt
wps: /.rockbox/wps/LookAtMe.wps
sbs: /.rockbox/wps/LookAtMe.sbs
backdrop: /.rockbox/backdrops/retroTapeFixed_bd.bmp
iconset: -
viewers iconset: -
show shutdown message: off
qs top: eq enabled
qs left: shuffle
qs right: repeat
qs bottom: -
